[pytest]
# The workspace had no pytest configuration; this one belongs to the package.
# Run from host/:  python -m pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers

# Every test must run offline: no real serial port, no network.
markers =
    sim: uses the in-memory simulator (no board required)
    no_board: explicitly marks a test that needs no board

filterwarnings =
    error::DeprecationWarning:ego_bridge.*
