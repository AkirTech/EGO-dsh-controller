[pytest]
# 工作区里原本没有 pytest 配置文件，这份是本包自带的。
# 从这里（host/）运行即可：python -m pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
# 全部测试必须离线跑通：不要求真串口、不联网。
markers =
    sim: 使用模拟器（不需要真实板卡）
    no_board: 明确标记「没有板卡」的测试
filterwarnings =
    error::DeprecationWarning:ego_bridge.*
